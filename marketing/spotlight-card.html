<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #0A1628;
      --teal: #0D9488;
      --sand: #F8F4EC;
      --muted: #8C9CAC;
      --white: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1080px;
      background:
        radial-gradient(ellipse 70% 50% at 85% 10%, rgba(13,148,136,0.22), transparent 55%),
        radial-gradient(ellipse 50% 40% at 5% 95%, rgba(13,148,136,0.12), transparent 50%),
        linear-gradient(180deg, #0A1628 0%, #0D1B33 100%);
      color: var(--sand);
      font-family: Manrope, sans-serif;
      overflow: hidden;
      position: relative;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 54px 54px;
      pointer-events: none;
    }
    .pad { position: relative; z-index: 1; padding: 70px 72px; height: 100%; display: flex; flex-direction: column; }
    .top { display: flex; justify-content: space-between; align-items: baseline; }
    .brand { font-family: Syne, sans-serif; font-weight: 700; font-size: 28px; letter-spacing: 0.08em; color: var(--sand); }
    .eyebrow { margin-top: 18px; color: var(--teal); font-size: 24px; font-weight: 500; }
    .form { color: var(--muted); font-size: 22px; letter-spacing: 0.12em; text-transform: uppercase; }
    .headline { margin-top: 72px; font-family: Syne, sans-serif; font-weight: 700; font-size: 92px; line-height: 1.02; color: var(--white); max-width: 920px; }
    .rule { width: 120px; height: 4px; background: var(--teal); margin: 28px 0 24px; }
    .subhead { font-size: 34px; line-height: 1.3; color: var(--sand); max-width: 860px; }
    .bullets { list-style: none; margin-top: 48px; display: flex; flex-direction: column; gap: 18px; }
    .bullets li { font-size: 28px; padding-left: 28px; position: relative; color: var(--sand); }
    .bullets li::before {
      content: "";
      position: absolute;
      left: 0; top: 12px;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--teal);
    }
    .bottom { margin-top: auto; }
    .cta {
      display: inline-block;
      border: 2px solid var(--teal);
      color: var(--teal);
      font-family: Syne, sans-serif;
      font-weight: 600;
      font-size: 26px;
      padding: 16px 36px;
      margin-bottom: 28px;
    }
    .disclaimer { font-size: 18px; line-height: 1.4; color: var(--muted); max-width: 920px; }
  </style>
</head>
<body>
  <div class="pad">
    <div class="top">
      <div>
        <div class="brand">PALM BEACH VITALITY</div>
        <div class="eyebrow">Laboratory research material</div>
      </div>
      <div class="form">{{PRODUCT_FORM}}</div>
    </div>
    <div class="headline">{{HEADLINE}}</div>
    <div class="rule"></div>
    <div class="subhead">{{SUBHEAD}}</div>
    <ul class="bullets">
      <li>{{BULLET_1}}</li>
      <li>{{BULLET_2}}</li>
      <li>{{BULLET_3}}</li>
    </ul>
    <div class="bottom">
      <div class="cta">{{CTA}}</div>
      <div class="disclaimer">For laboratory research use only. Not for human use or consumption. Not a drug, dietary supplement, or cosmetic. Not evaluated by the FDA.</div>
    </div>
  </div>
</body>
</html>
